<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Usuários • Node.js + MySQL</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Efeitos de iluminação de fundo -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <main class="app-container">
    <!-- Cabeçalho -->
    <header class="app-header">
      <div class="badge-tech">
        <span class="status-dot"></span>
        <span>Node.js &bull; Express &bull; MySQL</span>
      </div>
      <h1>Cadastro de Usuários</h1>
      <p class="subtitle">Cadastre e liste registros sincronizados em tempo real com o banco de dados MySQL.</p>
    </header>

    <!-- Grid com Formulário e Lista de Usuários -->
    <div class="app-grid">
      <!-- Card do Formulário -->
      <section class="card form-card">
        <div class="card-header">
          <div class="icon-circle icon-indigo">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <line x1="19" y1="8" x2="19" y2="14"></line>
              <line x1="22" y1="11" x2="16" y2="11"></line>
            </svg>
          </div>
          <div>
            <h2>Novo Cadastro</h2>
            <p>Insira as informações do usuário</p>
          </div>
        </div>

        <form id="formulario">
          <div class="input-group">
            <label for="nome">Nome Completo</label>
            <div class="input-wrapper">
              <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <input id="nome" type="text" placeholder="Ex: Maria Silva" required autocomplete="name">
            </div>
          </div>

          <div class="input-group">
            <label for="email">Endereço de E-mail</label>
            <div class="input-wrapper">
              <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
              <input id="email" type="email" placeholder="Ex: maria@email.com" required autocomplete="email">
            </div>
          </div>

          <button id="btn-cadastrar" type="submit">
            <span class="btn-text">Cadastrar</span>
            <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </button>
        </form>

        <p id="mensagem" class="mensagem" aria-live="polite"></p>
      </section>

      <!-- Card da Lista de Usuários -->
      <section class="card list-card">
        <div class="card-header">
          <div class="icon-circle icon-cyan">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
              <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
              <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
            </svg>
          </div>
          <div>
            <div class="list-title-row">
              <h2>Usuários Cadastrados</h2>
              <span id="contador-usuarios" class="count-badge">0</span>
            </div>
            <p>Registros salvos na tabela <code>usuarios</code></p>
          </div>
        </div>

        <div class="list-scroll-area">
          <ul id="lista"></ul>
        </div>
      </section>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
