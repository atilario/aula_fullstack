<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.2" />
  <title>Apresentação</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      color: #2b2b2b;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.12);
      max-width: 600px;
      width: 90%;
      padding: 32px;
      text-align: center;
    }

    h1 {
      margin-bottom: 8px;
      color: #1f4a78;
    }

    h2 {
      margin: 12px 0 24px;
      color: #4a4a4a;
      font-weight: normal;
    }

    p {
      line-height: 1.7;
      margin: 0;
    }

    .highlight {
      color: #ff6b6b;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Olá, eu sou o Atila</h1>
    <h2>Curso de Desenvolvimento Full Stack</h2>
    <p>
      Sou estudante de <span class="highlight">Desenvolvimento Full Stack</span> e estou em busca de aprender novas tecnologias,
      criar projetos funcionais e me preparar para o mercado. Adoro combinar lógica e design para entregar soluções
      bonitas, intuitivas e eficientes.
    </p>
  </div>
</body>
</html>
