<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide 26 - Exemplo com botão e parâmetro</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background-color 0.4s ease;
        }
        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            text-align: center;
        }
        h2 {
            margin-bottom: 1.5rem;
            color: #333;
        }
        .btn-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }
        button {
            padding: 0.8rem 1.8rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .btn-blue {
            background-color: lightblue;
            color: #0c4a6e;
        }
        .btn-green {
            background-color: lightgreen;
            color: #064e3b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Exemplo com botão e parâmetro</h2>
        <!-- HTML do slide 26 -->
        <div class="btn-group">
            <button class="btn-blue" onclick="mudarCor('lightblue')">Azul</button>
            <button class="btn-green" onclick="mudarCor('lightgreen')">Verde</button>
        </div>
    </div>

    <script src="20_mudarCor.js"></script>
</body>
</html>
